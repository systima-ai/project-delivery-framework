# pdf-relationship-health customisation

[workflow]
artifact_pattern = "05-governance/relationship-health-cards/{date}.md"
intents = ["create", "update", "validate", "dump-merge"]
preceded_by = ["pdf-create-charter"]

[workflow.sub_dimensions]
items = [
  "Credibility",
  "Reliability",
  "Candour",
  "Client-Centred Orientation",
  "Engagement Cadence",
  "Alignment",
]
require_all_assessed = true

[workflow.output]
summary_table_required = true
narrative_per_subdimension_required = true
evidence_must_be_behavioural = true

[workflow.rag]
values = ["R", "A", "G"]
overall_rule = "worst_of_subdimensions"
allow_overall_override_with_justification = true

[workflow.subject]
modes = ["engagement", "stakeholder"]
default_from_map = "Manage Closely"

[workflow.sources]
default_mode = "ask"
fallback_mode = "interview"
record_in_frontmatter = true

[workflow.cadence]
default_days = 28
overridable_per_engagement = true

[workflow.red_team]
default = "off"

[workflow.handoff]
on_red_subdimension = "pdf-update-raid"
on_red_overall = "pdf-write-escalation-memo"
on_red_candour_or_orientation = "pdf-prep-1on1"
on_completion = "pdf-help"
